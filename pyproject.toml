[project]
name = "autodnd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "blessed>=1.39.0",
    "pydantic>=2.9",
    "pydantic-ai>=0.0.14",
    "python-dotenv>=1.0",
]

[project.scripts]
autodnd = "autodnd.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autodnd"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
